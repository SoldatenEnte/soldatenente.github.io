<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no: without it iOS double-tap-to-zoom
         fires on taps meant for the panel buttons, and the page zooms instead
         of the button pressing. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Artisan — Bouncing Rects</title>
    <style>
      :root {
        --accent: #7dd3fc;
        --good: #4ade80;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        background: #000;
        color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        /* Nothing here pans or zooms, so let the browser skip its scroll and
           pull-to-refresh gestures entirely — otherwise a tap that lands on the
           canvas can bounce the whole page. */
        touch-action: none;
      }
      #toggle {
        position: absolute;
        top: max(18px, env(safe-area-inset-top));
        left: max(18px, env(safe-area-inset-left));
        z-index: 12;
        padding: 6px 12px;
        font-size: 0.7rem;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: #64748b;
        background: rgba(8, 10, 20, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 999px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        transition: color 0.15s, border-color 0.15s;
      }
      #toggle:hover {
        color: var(--accent);
        border-color: rgba(125, 211, 252, 0.4);
      }
      #fullscreen {
        position: absolute;
        top: max(18px, env(safe-area-inset-top));
        right: max(18px, env(safe-area-inset-right));
        z-index: 12;
        width: 34px;
        height: 34px;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        line-height: 1;
        color: #64748b;
        background: rgba(8, 10, 20, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 999px;
        cursor: pointer;
        backdrop-filter: blur(8px);
      }
      /* No F key on a phone, so the button is the only way in — shown only
         where it's needed, via a JS check for touch support (see game.js). */
      body.touch #fullscreen {
        display: flex;
      }
      #ui[hidden] {
        display: none;
      }
      #ui {
        position: absolute;
        top: max(18px, env(safe-area-inset-top));
        left: max(18px, env(safe-area-inset-left));
        width: 258px;
        /* On a narrow screen the fixed width would run off the edge, and the
           tall preset list can outgrow a short one — so cap both against the
           viewport and let the panel scroll rather than overflow. */
        max-width: calc(100vw - 2 * max(18px, env(safe-area-inset-left)) - 2px);
        max-height: calc(100vh - 2 * max(18px, env(safe-area-inset-top)));
        overflow-y: auto;
        /* The panel itself should still scroll with a finger; only the canvas
           behind it opts out of default touch handling. */
        touch-action: pan-y;
        padding: 14px 15px;
        background: rgba(6, 8, 18, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 10px;
        backdrop-filter: blur(14px);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        z-index: 10;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      h1 {
        margin: 0;
        font-size: 0.88rem;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: var(--accent);
      }
      #close {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        min-width: 0;
        padding: 0;
        font-size: 0.95rem;
        line-height: 1;
        color: #64748b;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 5px;
        cursor: pointer;
      }
      #close:hover {
        color: #f1f5f9;
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.28);
      }
      .section {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .label {
        font-size: 0.62rem;
        letter-spacing: 1.3px;
        text-transform: uppercase;
        color: #64748b;
        margin-bottom: 8px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        font-family: ui-monospace, monospace;
        font-size: 0.71rem;
        padding: 1px 0;
      }
      .row span:last-child {
        color: var(--accent);
      }
      .row.hero span:last-child {
        color: var(--good);
        font-weight: 700;
      }
      .btns {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      button {
        flex: 1;
        min-width: 52px;
        padding: 5px 3px;
        font-size: 0.68rem;
        font-weight: 600;
        color: #cbd5e1;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.12s;
      }
      button:hover {
        background: rgba(125, 211, 252, 0.18);
      }
      button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #04050c;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 0.95rem;
        color: var(--accent);
        background: rgba(4, 5, 12, 0.75);
        z-index: 20;
      }
      .custom {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .custom input {
        flex: 1;
        min-width: 0;
        padding: 5px 7px;
        font-family: ui-monospace, monospace;
        font-size: 0.71rem;
        color: #e2e8f0;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 5px;
      }
      .custom input:focus {
        outline: none;
        border-color: rgba(125, 211, 252, 0.55);
      }
      .custom button {
        flex: 0 0 auto;
        min-width: 58px;
      }
      #note {
        margin-top: 7px;
        font-size: 0.66rem;
        line-height: 1.4;
        color: #94a3b8;
        min-height: 0.9rem;
      }
      #hint {
        position: absolute;
        bottom: max(20px, env(safe-area-inset-bottom));
        left: max(24px, env(safe-area-inset-left));
        font-size: 0.72rem;
        color: #475569;
        z-index: 10;
      }

      /* Coarse pointer = finger, not mouse — the actual "is this touch" signal,
         more reliable than screen width (a touch laptop is wide; a mouse-driven
         tool window can be narrow). Bigger tap targets only; nothing about
         layout or information density changes. */
      @media (pointer: coarse) {
        #toggle,
        #close,
        #fullscreen {
          min-width: 40px;
          min-height: 40px;
        }
        button {
          padding: 10px 6px;
          font-size: 0.74rem;
        }
        .btns {
          gap: 8px;
        }
        /* 16px is the threshold below which iOS Safari zooms the page on focus,
           which on this input would yank the view sideways mid-typing. */
        .custom input {
          font-size: 16px;
          padding: 9px 8px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <button id="toggle">stats</button>
    <button id="fullscreen" title="Fullscreen" aria-label="Fullscreen">⛶</button>

    <div id="ui" hidden>
      <div class="head">
        <h1>Bouncing Rects</h1>
        <button id="close" title="Close (H)" aria-label="Close">×</button>
      </div>

      <div class="section">
        <div class="label">Rects</div>
        <div class="btns">
          <button data-count="10000">10k</button>
          <button data-count="100000">100k</button>
          <button data-count="500000">500k</button>
          <button data-count="1000000">1M</button>
          <button data-count="2000000">2M</button>
          <button data-count="8000000">8M</button>
          <button data-count="16000000">16M</button>
          <button data-count="32000000">32M</button>
        </div>
        <div class="custom">
          <input
            id="count-input"
            type="number"
            min="1"
            step="1"
            placeholder="custom…"
          />
          <button id="count-go">Spawn</button>
        </div>
        <div id="note"></div>
      </div>

      <div class="section">
        <div class="label">Frame</div>
        <div class="row hero"><span>Rects</span><span id="v-count">—</span></div>
        <div class="row hero"><span>FPS</span><span id="v-fps">—</span></div>
        <div class="row"><span>Frame time</span><span id="v-frame">—</span></div>
        <div class="row"><span>GPU</span><span id="v-gpu">—</span></div>
      </div>
    </div>

    <div id="loading">Loading…</div>
    <div id="hint">H stats · F fullscreen</div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
