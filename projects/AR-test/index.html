<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>iPhone 8 AR Fixed</title>
    <!-- We use slightly older, more stable versions for better legacy support -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: -apple-system, sans-serif; text-align: center; padding: 20px;
        }
        button {
            padding: 20px 40px; font-size: 20px; font-weight: bold;
            background: #057aff; color: white; border: none; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); -webkit-appearance: none;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="margin-bottom: 10px;">AR Ready</h2>
        <p style="margin-bottom: 25px; opacity: 0.8;">Tap below to enable camera</p>
        <button id="startButton">START CAMERA</button>
    </div>

    <!-- 
      IMPORTANT: We set uiError:no and uiLoading:no to prevent 
      the "Failed to launch" message from appearing.
    -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiError: no; uiLoading: no; uiScanning: yes;" 
        embedded color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane color="black" position="0 0 0" height="1" width="1"></a-plane>
        </a-entity>
    </a-scene>

    <script>
        const startButton = document.querySelector("#startButton");
        const overlay = document.querySelector("#overlay");
        const sceneEl = document.querySelector("a-scene");

        startButton.addEventListener('click', () => {
            overlay.style.display = "none";
            
            // On iOS, the first click MUST trigger the camera system
            const startAR = () => {
                const mindarSystem = sceneEl.systems["mindar-image-system"];
                if (mindarSystem) {
                    mindarSystem.start(); 
                }
            };

            // Start with a tiny delay to ensure A-Frame is ready
            if (sceneEl.hasLoaded) {
                startAR();
            } else {
                sceneEl.addEventListener('loaded', startAR);
            }
        });
    </script>
</body>
</html>
