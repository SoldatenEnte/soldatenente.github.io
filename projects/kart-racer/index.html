<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS Kart Engine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:ital,wght@0,400;0,900;1,900&display=swap');

        body { margin: 0; overflow: hidden; background: #111; font-family: 'Roboto', sans-serif; user-select: none; }

        canvas { display: block; }

        /* --- HUD CONTAINER --- */

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* --- SPEEDOMETER (Debug Only) --- */

        #phys-ui {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; align-items: flex-end;
            transform: skewX(-10deg);
        }

        #turbo-container {
            width: 300px; height: 15px; background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.3); border-radius: 4px;
            overflow: hidden; margin-bottom: 5px; opacity: 0; transition: opacity 0.2s;
        }

        #turbo-bar { width: 0%; height: 100%; background: white; box-shadow: 0 0 15px white; }

        #speedometer {
            font-size: 4rem; font-weight: 900; color: white; font-style: italic;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.5); line-height: 0.8;
        }

        #speed-label { font-size: 1.5rem; color: #f1c40f; font-weight: bold; }

        /* --- TOP INFO (Laps & Time) --- */

        #top-bar {
            display: flex; justify-content: space-between; padding: 20px 40px;
            font-family: 'Black Ops One', cursive; text-transform: uppercase;
            color: white; text-shadow: 2px 2px 0 #000;
        }

        .hud-box {
            background: rgba(0,0,0,0.5); padding: 10px 20px;
            border-left: 5px solid #f1c40f; transform: skewX(-15deg);
        }

        .hud-content { transform: skewX(15deg); text-align: center; }

        .hud-label { font-size: 1rem; color: #aaa; letter-spacing: 2px; }

        /* FIX: Fixed width and monospace look to prevent jitter */

        .hud-value { 
            font-size: 2.5rem; color: #fff; 
            min-width: 200px; 
            display: inline-block;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Make Lap Display compact */

        #lap-display { min-width: 100px; }

        /* --- COUNTDOWN --- */

        #countdown {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Black Ops One', cursive; font-size: 15rem;
            color: #fff; text-shadow: 0 10px 30px rgba(0,0,0,0.8);
            pointer-events: none; opacity: 0;
        }

        .anim-pop { animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* --- LAP NOTIFICATION --- */

        #lap-notify {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Black Ops One', cursive; color: #f1c40f;
            text-shadow: 4px 4px 0 #000; font-size: 5rem;
            opacity: 0; pointer-events: none; white-space: nowrap;
        }

        .anim-slide { animation: slideAcross 2s ease-in-out forwards; }

        @keyframes slideAcross {
            0% { transform: translate(-150%, -50%) skewX(-20deg); opacity: 0; }
            20% { transform: translate(-50%, -50%) skewX(-20deg); opacity: 1; }
            80% { transform: translate(-50%, -50%) skewX(-20deg); opacity: 1; }
            100% { transform: translate(150%, -50%) skewX(-20deg); opacity: 0; }
        }

        /* --- FINISH SCREEN --- */

        #finish-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; color: white; pointer-events: auto;
        }

        h1 { font-family: 'Black Ops One'; font-size: 5rem; margin: 0; color: #f1c40f; text-shadow: 0 0 20px #f1c40f; }

        .time-big { font-size: 4rem; font-weight: 900; margin: 10px 0 30px 0; }

        #highscore-list {
            background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px;
            width: 400px; margin-bottom: 30px;
        }

        .score-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.2); padding: 10px; font-size: 1.2rem; }

        .score-row:first-child { color: #f1c40f; font-weight: bold; }

        .btn-restart {
            padding: 15px 40px; font-size: 1.5rem; font-family: 'Black Ops One';
            background: #e74c3c; color: white; border: none; transform: skewX(-10deg);
            cursor: pointer; transition: all 0.2s; box-shadow: 5px 5px 0 #c0392b;
        }

        .btn-restart:hover { background: #ff5e4d; transform: skewX(-10deg) scale(1.05); }

        /* UTILS */

        .hidden { display: none !important; }
    </style>
  <script type="module" crossorigin src="./assets/main-CL-QB72r.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/GLTFLoader-DbBDHowW.js">
</head>
<body>
    <div id="hud">
        <div id="top-bar">
            <div class="hud-box">
                <div class="hud-content">
                    <div class="hud-label">TIME</div>
                    <div class="hud-value" id="timer-display">00:00.00</div>
                </div>
            </div>
            <div class="hud-box">
                <div class="hud-content">
                    <div class="hud-label">LAP</div>
                    <div class="hud-value" id="lap-display">1 / 3</div>
                </div>
            </div>
        </div>

        <div id="countdown"></div>
        <div id="lap-notify">LAP 2</div>

        <div id="phys-ui">
            <div id="turbo-container"><div id="turbo-bar"></div></div>
            <div id="speedometer">0</div>
            <div id="speed-label">KPH</div>
        </div>
    </div>

    <div id="finish-screen">
        <h1>FINISHED!</h1>
        <div class="time-big" id="final-time">01:23.45</div>
        
        <div id="highscore-list">
            <div style="text-align:center; margin-bottom:10px; opacity:0.7;">TOP RECORDS</div>
            <div id="scores-container"></div>
        </div>

        <button class="btn-restart" id="btn-restart">RACE AGAIN</button>
    </div>

</body>
</html>
