<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="100%" height="auto" role="img" aria-label="Vergleich CPU/ECS-Instancing vs. GPU-Compute-Simulation">
  <style>
    text[fill="#14161a"] { fill: #eef0f3; }
    text[fill="#7a3607"] { fill: #f0a15e; }
    text[fill="#6a40c2"] { fill: #b99af2; }
    rect[fill="#fafafa"] { fill: #0b0c0f; }
    rect[fill="#ffffff"] { fill: #111318; stroke: #353941; }
    rect[fill="#f4f5f8"] { fill: #1a1d23; stroke: #3a3f48; }
    rect[fill="#fdf1e6"] { fill: #3a2417; stroke: #70401f; }
    rect[fill="#f5f0fc"] { fill: #281f3d; stroke: #594683; }
    line[stroke="#9a9fa8"] { stroke: #838a95; }
    path[fill="#9a9fa8"] { fill: #838a95; }
  </style>
  <rect width="100%" height="100%" fill="#fafafa" rx="10"/>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9a9fa8"/>
    </marker>
  </defs>

  <!-- Pfad A: CPU / ECS-Pfad -->
  <g transform="translate(24, 18)">
    <rect width="692" height="98" rx="8" fill="#ffffff" stroke="#d8dbe0" stroke-width="1.3"/>
    <rect x="0" y="0" width="6" height="98" rx="3" fill="#c1560a"/>
    <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" fill="#14161a">Pfad A: CPU / ECS-Simulation mit WebGPU-Instancing (Murmuration CPU-Modus)</text>
    
    <!-- Kasten 1: Rust ECS -->
    <rect x="18" y="40" width="130" height="38" rx="5" fill="#fdf1e6" stroke="#f3d9bb"/>
    <text x="83" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#7a3607">Rust ECS World</text>

    <!-- Pfeil 1 -->
    <line x1="154" y1="59" x2="174" y2="59" stroke="#9a9fa8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

    <!-- Kasten 2: Wasm Linearspeicher -->
    <rect x="180" y="40" width="145" height="38" rx="5" fill="#f4f5f8" stroke="#d8dbe0"/>
    <text x="252" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#14161a">Wasm-Linearspeicher</text>

    <!-- Pfeil 2 -->
    <line x1="331" y1="59" x2="351" y2="59" stroke="#9a9fa8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

    <!-- Kasten 3: writeBuffer -->
    <rect x="357" y="40" width="155" height="38" rx="5" fill="#f4f5f8" stroke="#d8dbe0"/>
    <text x="434" y="64" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#14161a">writeBuffer (VRAM)</text>

    <!-- Pfeil 3 -->
    <line x1="518" y1="59" x2="538" y2="59" stroke="#9a9fa8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

    <!-- Kasten 4: Result -->
    <rect x="544" y="40" width="132" height="38" rx="5" fill="#ffffff" stroke="#c1560a" stroke-width="1.3"/>
    <text x="610" y="64" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#7a3607">1,35 Mio. @ 60 FPS</text>
  </g>

  <!-- Pfad B: GPU Compute Pfad -->
  <g transform="translate(24, 130)">
    <rect width="692" height="98" rx="8" fill="#ffffff" stroke="#d8dbe0" stroke-width="1.3"/>
    <rect x="0" y="0" width="6" height="98" rx="3" fill="#6a40c2"/>
    <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" fill="#14161a">Pfad B: Vollständige GPU-Compute-Simulation (Murmuration GPU-Modus)</text>
    
    <!-- Kasten 1: ECS Config -->
    <rect x="18" y="40" width="130" height="38" rx="5" fill="#f4f5f8" stroke="#d8dbe0"/>
    <text x="83" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#14161a">ECS (nur Config)</text>

    <!-- Pfeil 1 -->
    <line x1="154" y1="59" x2="174" y2="59" stroke="#9a9fa8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

    <!-- Kasten 2: GPU Storage Buffer -->
    <rect x="180" y="40" width="332" height="38" rx="5" fill="#f5f0fc" stroke="#d4c2f5"/>
    <text x="346" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#6a40c2">GPU Storage Buffer · WebGPU Compute Shader</text>

    <!-- Pfeil 2 -->
    <line x1="518" y1="59" x2="538" y2="59" stroke="#9a9fa8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

    <!-- Kasten 3: Result -->
    <rect x="544" y="40" width="132" height="38" rx="5" fill="#ffffff" stroke="#6a40c2" stroke-width="1.3"/>
    <text x="610" y="64" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#6a40c2">10,0 Mio. @ 60 FPS</text>
  </g>
</svg>
